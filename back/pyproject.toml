[project]
name = "ia-sante-back"
version = "1.0.0"
description = "API du projet Cancer du sein et IA : catalogue des modeles, cas, sources et statistiques anonymes."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 : « Depends() » en valeur par défaut est l'usage documenté de FastAPI
ignore = ["B008"]
