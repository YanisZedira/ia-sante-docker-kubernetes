# MODÈLE seulement : rangé dans deploy/examples/, il n'est pas appliqué par « kubectl apply -f deploy/ »
# (la commande ne descend pas dans les sous-dossiers).
#
# Le vrai Secret se crée en ligne de commande, sans jamais écrire le mot de passe dans Git :
#
#   kubectl -n ia-sante create secret generic postgres-secret \
#     --from-literal=PGPASSWORD="$(openssl rand -hex 16)"
#
# Équivalent YAML (valeurs en base64), à garder hors du dépôt (deploy/secret.yaml est dans .gitignore) :
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: postgres-secret
#   namespace: ia-sante
# type: Opaque
# data:
#   PGPASSWORD: <mot de passe encodé en base64>
